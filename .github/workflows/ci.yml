# Every push and pull request: types, lint, unit tests, a production build, the integration tests (against the real Worker on a small deterministic fixture league: no synced data needed)
# and the Python research tests. Nothing here writes to Cloudflare or calls a paid API.
name: ci
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run test:integration
        env:
          UBET_FIXTURE: '1'
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn tzdata pdfplumber nba_api
      - run: python research/tests/run_all.py
